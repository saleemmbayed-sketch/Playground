name: CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify the live TED API contract still holds
        continue-on-error: true
        run: TED_OFFLINE=false npx tsx src/cli.ts check-ted --days 3
